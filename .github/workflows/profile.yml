name: Refresh profile

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build from live GitHub data and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated files only: if main moved meanwhile, rebuild on top of it instead of merging.
          for attempt in 1 2 3; do
            python scripts/build_profile.py
            git add README.md assets
            if git diff --cached --quiet; then
              echo "Profile already up to date."
              exit 0
            fi
            git commit -m "chore: refresh profile data [skip ci]"
            if git push; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
