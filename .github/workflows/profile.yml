name: Refresh profile

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BOT_NAME: github-actions[bot]
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Draw the contribution snake
        run: |
          npx -y generate-snake-animation@3 \
            --github_user="$GITHUB_REPOSITORY_OWNER" \
            --output="build/snake.svg?$(python3 scripts/build.py --snake-options)"

      - name: Build the images and the README
        run: python3 scripts/build.py

      # The images live on a one-commit branch that is replaced on every change,
      # so refreshes never pile up in the history of main.
      - name: Publish the images to the images branch
        working-directory: dist
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b images
          git add -A
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -qm "Profile images"
          published=$(git fetch -q --depth=1 "$remote" images 2>/dev/null && git rev-parse 'FETCH_HEAD^{tree}' || true)
          if [ "$(git rev-parse 'HEAD^{tree}')" = "$published" ]; then
            echo "Images already up to date."
          else
            git push -qf "$remote" images
          fi

      - name: Commit the README if its text changed
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README already up to date."
            exit 0
          fi
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -qm "Update profile README"
          git push -q
