<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 52" width="320" height="52" overflow="hidden" role="img" aria-label="GitHub Pulse">
  <title>GitHub Pulse</title>
  <defs>
    <clipPath id="clip-pulse"><rect x="0" y="0" width="320" height="52"/></clipPath>
    <style type="text/css"><![CDATA[
      .row{font:800 24px ui-monospace,system-ui,monospace;fill:#c8e4ff;letter-spacing:.09em;text-anchor:middle;text-shadow:0 1px 2px rgba(88,166,255,.22),0 0 4px rgba(56,189,248,.12);}
      .final{font:800 24px ui-sans-serif,system-ui,sans-serif;fill:#c8e4ff;letter-spacing:.1em;text-anchor:middle;text-shadow:0 1px 2px rgba(88,166,255,.22),0 0 4px rgba(56,189,248,.12);}
      #slotwrap-pulse{
        animation: holdglitch-pulse 22s ease-in-out infinite;
        transform-origin: 160px 26px;
      }
      @keyframes holdglitch-pulse{
        0%, 26%, 100% { transform: translate(0,0); opacity: 1; }
        26.02% { transform: translate(-2px, 0); opacity: 0.9; }
        26.05% { transform: translate(3px, 0); opacity: 1; }
        26.08% { transform: translate(0, 0); }
        52%, 52.02% { opacity: 0.35; }
        52.05% { opacity: 1; }
        71%, 71.02% { transform: skewX(-2deg); }
        71.05% { transform: skewX(0); }
        88%, 88.02% { transform: translate(1px, 0); }
        88.04% { transform: translate(0, 0); }
      }
    ]]></style>
  </defs>
