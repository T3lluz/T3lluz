<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" role="img" aria-label="Contact">
  <title>Contact</title>
  <defs>
    <style type="text/css"><![CDATA[
      .main{font:800 26px ui-sans-serif,system-ui,"Segoe UI",sans-serif;fill:#d8efff;letter-spacing:.12em;text-anchor:middle;text-shadow:0 0 4px #58A6FF,0 0 12px #38bdf8,0 0 22px rgba(31,111,235,.8),0 0 36px rgba(88,166,255,.38);animation:flick 12.6s linear infinite;animation-delay:.35s}
      .g1{font:800 26px ui-sans-serif,system-ui,sans-serif;fill:#79b8ff;letter-spacing:.12em;text-anchor:middle;opacity:0;animation:gs1 12.6s linear infinite;animation-delay:.35s}
      .g2{font:800 26px ui-sans-serif,system-ui,sans-serif;fill:#1F6FEB;letter-spacing:.12em;text-anchor:middle;opacity:0;animation:gs2 12.6s linear infinite;animation-delay:.35s}
      .mix{font:800 24px ui-monospace,monospace;fill:#58A6FF;letter-spacing:.12em;text-anchor:middle;opacity:0;animation:sc 12.6s linear infinite;animation-delay:.35s}
      #slot{transform-origin:110px 36px;animation:jitter 12.6s linear infinite;animation-delay:.35s}
      @keyframes jitter{0%,83.8%,100%{transform:translate(0,0)}84.5%{transform:translate(-4px,-1px)}85.5%{transform:translate(5px,2px)}86.5%{transform:translate(-3px,0)}87.5%{transform:translate(0,0)}}
      @keyframes gs1{0%,84.5%,100%{opacity:0}85%{opacity:.64}85.5%{opacity:.28}86.1%{opacity:0}}
      @keyframes gs2{0%,84.7%,100%{opacity:0}85.2%{opacity:.54}85.7%{opacity:.33}86.3%{opacity:0}}
      @keyframes flick{0%,86.5%,100%{opacity:1}86.7%{opacity:.11}86.85%{opacity:1}87.2%{opacity:.43}87.35%{opacity:1}92.8%,93.5%{opacity:1}92.95%{opacity:.09}93.05%{opacity:1}}
      @keyframes sc{0%,84.2%,100%{opacity:0}84.35%{opacity:.91}84.55%{opacity:.36}84.75%{opacity:.87}84.95%{opacity:0}}
    ]]></style>
  </defs>
  <g id="slot">
    <text class="g1" x="110" y="36">Contact</text>
    <text class="g2" x="110" y="36">Contact</text>
    <text class="mix" x="110" y="36">C0nt4ct</text>
    <text class="main" x="110" y="36">Contact</text>
  </g>
</svg>
