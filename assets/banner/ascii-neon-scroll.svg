<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Animated ASCII neon banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#30363d" />

  <g transform="translate(0,0)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="-452 0"
      dur="16s"
      repeatCount="indefinite"
    />

    <g filter="url(#neon)" fill="#58a6ff" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700">
      <text x="20" y="70" xml:space="preserve">  _____ _____ _         </text>
      <text x="20" y="106" xml:space="preserve"> |_   _|__ / | |_  _ ___</text>
      <text x="20" y="142" xml:space="preserve">   | |  |_ \ | | || |_ /</text>
      <text x="20" y="178" xml:space="preserve">   |_| |___/_|_|\_,_/__|</text>
    </g>

    <g filter="url(#neon)" fill="#58a6ff" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700">
      <text x="472" y="70" xml:space="preserve">  _____ _____ _         </text>
      <text x="472" y="106" xml:space="preserve"> |_   _|__ / | |_  _ ___</text>
      <text x="472" y="142" xml:space="preserve">   | |  |_ \ | | || |_ /</text>
      <text x="472" y="178" xml:space="preserve">   |_| |___/_|_|\_,_/__|</text>
    </g>

    <g filter="url(#neon)" fill="#58a6ff" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700">
      <text x="924" y="70" xml:space="preserve">  _____ _____ _         </text>
      <text x="924" y="106" xml:space="preserve"> |_   _|__ / | |_  _ ___</text>
      <text x="924" y="142" xml:space="preserve">   | |  |_ \ | | || |_ /</text>
      <text x="924" y="178" xml:space="preserve">   |_| |___/_|_|\_,_/__|</text>
    </g>

    <g filter="url(#neon)" fill="#58a6ff" font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700">
      <text x="1376" y="70" xml:space="preserve">  _____ _____ _         </text>
      <text x="1376" y="106" xml:space="preserve"> |_   _|__ / | |_  _ ___</text>
      <text x="1376" y="142" xml:space="preserve">   | |  |_ \ | | || |_ /</text>
      <text x="1376" y="178" xml:space="preserve">   |_| |___/_|_|\_,_/__|</text>
    </g>
  </g>
</svg>
