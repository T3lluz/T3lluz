<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Neon terminal banner with rotating profile quotes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .mono {
        font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
        fill: #58a6ff;
      }
      .soft {
        fill: #8bb9ff;
      }
    </style>
  </defs>

  <rect width="1200" height="220" rx="14" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="218" rx="13" fill="none" stroke="#30363d" />
  <rect x="20" y="20" width="1160" height="180" rx="10" fill="#0b1118" stroke="#1f2a38" />
  <rect x="20" y="52" width="1160" height="1" fill="url(#line)" />
  <circle cx="38" cy="36" r="5.2" fill="#ff6b6b" />
  <circle cx="56" cy="36" r="5.2" fill="#f7b955" />
  <circle cx="74" cy="36" r="5.2" fill="#7ee787" />

  <g class="mono" filter="url(#neon)">
    <text x="98" y="42" font-size="16">t3lluz@workspace:~</text>
    <text x="248" y="42" font-size="16" class="soft">readme --banner --clean</text>
  </g>

  <g class="mono" filter="url(#neon)">
    <text x="44" y="93" font-size="29" font-weight="700">T3lluz</text>
    <text x="44" y="124" font-size="18" class="soft">&gt; Full-stack student, local AI tinkerer, and UX polish enjoyer</text>
    <text x="44" y="150" font-size="17" class="soft">&gt; React + Node + Postgres | LM Studio + OpenCLAW | Stream Deck builds</text>
  </g>

  <g class="mono" font-size="18" filter="url(#neon)">
    <text x="44" y="181" class="soft">$ rotating_thoughts:</text>

    <text x="250" y="181">"I test in VMs first, panic later."
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.16;0.2;0.8;0.84;1" dur="18s" repeatCount="indefinite" />
    </text>
    <text x="250" y="181" opacity="0">"Clean UX beats clever code that nobody can read."
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.22;0.36;0.4;1" dur="18s" repeatCount="indefinite" />
    </text>
    <text x="250" y="181" opacity="0">"LM Studio locally, Cursor for flow, coffee for uptime."
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.42;0.56;0.6;1" dur="18s" repeatCount="indefinite" />
    </text>
    <text x="250" y="181" opacity="0">"Ship small, iterate fast, keep it maintainable."
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.62;0.76;0.8;1" dur="18s" repeatCount="indefinite" />
    </text>
    <text x="250" y="181" opacity="0">"One tiny tweak usually becomes a full desktop refactor."
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.82;0.96;0.99;1" dur="18s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
