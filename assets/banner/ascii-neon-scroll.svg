<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Neon terminal banner with profile quotes and ASCII logos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      .mono {
        font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
        fill: #58a6ff;
      }
      .soft {
        fill: #8bb9ff;
      }
    </style>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="none" stroke="#30363d" />
  <rect x="20" y="20" width="1160" height="280" rx="10" fill="#0b1118" stroke="#1f2a38" />
  <rect x="20" y="52" width="1160" height="1" fill="url(#line)" />
  <rect x="20" y="210" width="1160" height="1" fill="url(#line)" />
  <rect x="760" y="52" width="1" height="248" fill="url(#line)" />
  <circle cx="38" cy="36" r="5.2" fill="#ff6b6b" />
  <circle cx="56" cy="36" r="5.2" fill="#f7b955" />
  <circle cx="74" cy="36" r="5.2" fill="#7ee787" />

  <g class="mono" filter="url(#neon)">
    <text x="98" y="42" font-size="16">t3lluz@workspace:~</text>
    <text x="248" y="42" font-size="16" class="soft">readme --banner --ascii --no-overlap</text>
  </g>

  <g class="mono" filter="url(#neon)">
    <text x="44" y="96" font-size="31" font-weight="700">T3lluz</text>
    <text x="44" y="126" font-size="17" class="soft">&gt; Full-stack student focused on clean UX and practical builds</text>
    <text x="44" y="150" font-size="17" class="soft">&gt; React + Node + Postgres | LM Studio + OpenCLAW | Stream Deck tools</text>
    <text x="44" y="174" font-size="17" class="soft">&gt; VM lab enjoyer: isolate first, iterate fast, break less</text>
  </g>

  <g class="mono" font-size="17" filter="url(#neon)">
    <text x="44" y="241" class="soft">$ random_quote:</text>

    <text x="200" y="241">"I test in VMs first, panic later."
      <animate attributeName="opacity" values="1;1;0;0;0;0;0" keyTimes="0;0.15;0.2;0.4;0.6;0.8;1" dur="20s" repeatCount="indefinite" />
    </text>
    <text x="200" y="241" opacity="0">"Clean UX beats clever code nobody can maintain."
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.15;0.2;0.35;0.4;0.8;1" dur="20s" repeatCount="indefinite" />
    </text>
    <text x="200" y="241" opacity="0">"LM Studio local, Cursor flow, coffee-powered uptime."
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.35;0.4;0.55;0.6;0.8;1" dur="20s" repeatCount="indefinite" />
    </text>
    <text x="200" y="241" opacity="0">"Ship small, iterate fast, keep it readable."
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.55;0.6;0.75;0.8;0.95;1" dur="20s" repeatCount="indefinite" />
    </text>
    <text x="200" y="241" opacity="0">"One tiny tweak becomes a full desktop refactor."
      <animate attributeName="opacity" values="0;0;0;0;0;1;1" keyTimes="0;0.75;0.8;0.9;0.95;0.98;1" dur="20s" repeatCount="indefinite" />
    </text>
  </g>

  <g class="mono" filter="url(#neon)" font-size="12">
    <text x="785" y="75" class="soft">ARCH</text>
    <text x="785" y="92" xml:space="preserve">       / \</text>
    <text x="785" y="106" xml:space="preserve">      /   \</text>
    <text x="785" y="120" xml:space="preserve">     / /\  \</text>
    <text x="785" y="134" xml:space="preserve">    / /  \  \</text>
    <text x="785" y="148" xml:space="preserve">   /_/    \__\</text>

    <text x="965" y="75" class="soft">CACHYOS</text>
    <text x="965" y="92" xml:space="preserve">   _______</text>
    <text x="965" y="106" xml:space="preserve">  / ____  \</text>
    <text x="965" y="120" xml:space="preserve"> / /    \  \</text>
    <text x="965" y="134" xml:space="preserve">| |      | |</text>
    <text x="965" y="148" xml:space="preserve"> \ \____/ /</text>
    <text x="965" y="162" xml:space="preserve">  \______/</text>

    <text x="785" y="178" class="soft">WINDOWS</text>
    <text x="785" y="194" xml:space="preserve"> ######  ######</text>
    <text x="785" y="208" xml:space="preserve"> ######  ######</text>
    <text x="785" y="222" xml:space="preserve"></text>
    <text x="785" y="236" xml:space="preserve"> ######  ######</text>
    <text x="785" y="250" xml:space="preserve"> ######  ######</text>

    <text x="965" y="178" class="soft">LINUX</text>
    <text x="965" y="194" xml:space="preserve">   .--.</text>
    <text x="965" y="208" xml:space="preserve">  |o_o |</text>
    <text x="965" y="222" xml:space="preserve">  |:_/ |</text>
    <text x="965" y="236" xml:space="preserve"> //   \ \</text>
    <text x="965" y="250" xml:space="preserve">(|     | )</text>
    <text x="965" y="264" xml:space="preserve">/ _\_ _/ \</text>
    <text x="965" y="278" xml:space="preserve">\___)=(___/</text>
  </g>
</svg>
